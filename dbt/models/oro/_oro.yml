version: 2
models:
  - name: dim_piloto
    description: "Una fila por piloto"
    columns:
      - name: piloto
        data_tests: [unique, not_null]

  - name: dim_dron
    description: "Una fila por dron"
    columns:
      - name: dron
        data_tests: [unique, not_null]

  - name: dim_encargo
    description: "Una fila por tipo de encargo"
    columns:
      - name: encargo
        data_tests: [unique, not_null]

  - name: fact_vuelos
    description: "Un vuelo por fila, con sus medidas y las claves de sus tres dimensiones"
    columns:
      - name: vuelo
        data_tests: [unique, not_null]
      - name: piloto
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_piloto')
                field: piloto
      - name: dron
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dron')
                field: dron
      - name: encargo
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_encargo')
                field: encargo

  - name: pregunta_1
    description: "¿Qué tipo de encargo deja menos ingreso por minuto de vuelo? (€/min, de menor a mayor)"
  - name: pregunta_2
    description: "¿Qué piloto gasta más batería por minuto de vuelo? (Wh/min, de mayor a menor)"
  - name: pregunta_3
    description: "¿Qué dron acumula más incidencias por cada 100 minutos de vuelo? (de mayor a menor)"
  - name: pregunta_4
    description: "¿Qué dron tiene más vuelos sin aterrizaje registrado, en proporción? (de mayor a menor)"
    columns:
      - name: dron
        data_tests: [unique, not_null]

  - name: historia_terreno
    description: "La historia · una fila con las cifras de contexto de la flota y del DRN-24"
    columns:
      - name: ambito
        data_tests: [unique, not_null]
  - name: historia_semana
    description: "La historia · incidencias por 100 min, semana a semana, DRN-24 frente al resto"
    columns:
      - name: semana
        data_tests: [unique, not_null]
  - name: historia_dron_semana
    description: "La historia · incidencias por 100 min por dron y semana (mapa de calor)"
    columns:
      - name: celda
        data_tests: [unique, not_null]
  - name: historia_contraste
    description: "La historia · incidencias por 100 min con el parte sin limpiar (bronce) y limpio (plata)"
    columns:
      - name: dron
        data_tests: [unique, not_null]
  - name: historia_viento
    description: "La historia · rachas del día de cada vuelo, DRN-24 frente al resto de la flota"
    columns:
      - name: grupo
        data_tests: [unique, not_null]
  - name: historia_piloto
    description: "La historia · incidencias por 100 min por piloto, DRN-24 frente al resto de la flota"
    columns:
      - name: piloto
        data_tests: [unique, not_null]
  - name: historia_encargo
    description: "La historia · incidencias por 100 min por encargo, DRN-24 frente al resto de la flota"
    columns:
      - name: encargo
        data_tests: [unique, not_null]
